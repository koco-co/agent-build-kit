interface:
  display_name: "Rename Codex Sessions"
  short_description: "按创建日期和实际内容整理 Codex 会话标题"
  default_prompt: "使用 $rename-codex-sessions，为当前 Codex Desktop 本地项目中的主对话生成标题候选表；先读取脚本返回的 renameStatus，只为 renameable 线程读取内容并生成表格，日期只取 createdAt 并按系统本地时区转换（需要固定时区时用 --timezone）；确认前不要改名，确认后只调用 thread/name/set，并按 changed、unchanged、skipped、failed 报告结果。"

policy:
  allow_implicit_invocation: false
